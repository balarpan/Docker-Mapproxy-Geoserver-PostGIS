[project]
name = "miamap_restapi"
version = "0.1.0"
description = "miamap restapi support backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.0,<2.1.0",
]
[tool.fastapi]
entrypoint = "main:app"
